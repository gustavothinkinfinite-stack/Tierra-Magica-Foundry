name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - name: Validate system
        id: validate
        continue-on-error: true
        run: npm run validate > validation.log 2>&1
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-log
          path: validation.log
          retention-days: 2
      - name: Fail when validation failed
        if: steps.validate.outcome == 'failure'
        run: |
          cat validation.log
          exit 1
