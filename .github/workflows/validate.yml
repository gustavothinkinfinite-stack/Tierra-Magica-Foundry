name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - name: Validate system
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run audit:crafting > validation.log 2>&1
          crafting_status=$?
          npm run validate >> validation.log 2>&1
          validation_status=$?
          {
            echo
            echo "=== Validation exit codes ==="
            echo "audit:crafting: ${crafting_status}"
            echo "validate: ${validation_status}"
          } >> validation.log
          if (( crafting_status != 0 || validation_status != 0 )); then
            exit 1
          fi
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-log
          path: validation.log
          retention-days: 2
      - name: Fail when validation failed
        if: steps.validate.outcome == 'failure'
        run: |
          cat validation.log
          exit 1
