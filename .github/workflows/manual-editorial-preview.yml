name: Manual Básico — prueba editorial integral

on:
  push:
    branches:
      - review/auditoria-editorial-integral-2026-11-19
    paths:
      - 'tools/build-print-html.mjs'
      - 'tools/render-print-review.py'
      - 'tools/audit-print-review.py'
      - 'tools/audit-print-layout.py'
      - 'tools/audit-print-extraction.py'
      - 'tools/verify-print-manuscript.mjs'
      - 'tools/build-print-manuscript.mjs'
      - 'docs/edicion_impresa/**'
      - 'docs/Tierra_Magica_Manual_Maestro.md'
      - 'docs/REFERENCIA_RAPIDA_GLOSARIO_1.0.md'
      - '.github/workflows/manual-editorial-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prueba-manuscrito:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperar la rama editorial
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar reproducibilidad del manuscrito
        id: verify
        continue-on-error: true
        run: node tools/verify-print-manuscript.mjs
      - name: Generar HTML integral
        run: node tools/build-print-html.mjs
      - name: Comprobar salida
        run: |
          test -s docs/edicion_impresa/Manual_Basico_Prueba_Integral.html
          grep -q 'Contenido' docs/edicion_impresa/Manual_Basico_Prueba_Integral.html
          grep -q 'tm-r38' docs/edicion_impresa/Manual_Basico_Prueba_Integral.html
          grep -q 'tm-m14' docs/edicion_impresa/Manual_Basico_Prueba_Integral.html
          grep -q 'NO APROBADO PARA IMPRENTA' docs/edicion_impresa/Manual_Basico_Prueba_Integral.html
      - name: Preparar Python para PDF
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar convertidor y lector PDF
        run: python -m pip install --disable-pip-version-check weasyprint pypdf pymupdf pillow
      - name: Renderizar PDF integral y comprobar páginas
        run: python tools/render-print-review.py
      - name: Auditar capa de texto y geometría del PDF
        run: python tools/audit-print-review.py
      - name: Instalar Poppler para el tercer extractor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          pdftotext -v
      - name: Comparar extracción con Poppler e inspeccionar índice
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
          pdftotext -v
          python tools/audit-print-extraction.py
      - name: Auditar composición y crear hojas de contacto
        run: python tools/audit-print-layout.py
      - name: Preparar vistas de revisión de páginas
        run: |
          mkdir -p docs/edicion_impresa/vistas_revision
          if command -v pdftoppm >/dev/null 2>&1; then
            pdftoppm -f 1 -l 3 -scale-to 1000 -png docs/edicion_impresa/Tierra_Magica_Manual_Basico_Prueba_Integral.pdf docs/edicion_impresa/vistas_revision/pagina
          else
            echo 'pdftoppm no instalado; vistas PNG omitidas'
          fi
      - name: Publicar muestra visual en registro de auditoría
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          folder = Path('docs/edicion_impresa/vistas_revision')
          samples = [folder / 'contacto_general.jpg'] + sorted(folder.glob('tabla_*.jpg'))[:1]
          for file in samples:
              if file.is_file():
                  print('TM_IMG_BEGIN:' + file.name + ':' + base64.b64encode(file.read_bytes()).decode('ascii') + ':TM_IMG_END')
          PY
      - name: Publicar PDF e informe de paginación
        uses: actions/upload-artifact@v4
        with:
          name: Tierra-Magica-Manual-Basico-PDF-Revision
          path: |
            docs/edicion_impresa/Tierra_Magica_Manual_Basico_Prueba_Integral.pdf
            docs/edicion_impresa/Control_Paginacion_Prueba_Integral.json
            docs/edicion_impresa/Auditoria_Texto_Geometria_PDF.json
            docs/edicion_impresa/Auditoria_Tercer_Extractor_e_Indice.json
            docs/edicion_impresa/Auditoria_Composicion_Visual.json
            docs/edicion_impresa/vistas_revision/*.png
          if-no-files-found: error
      - name: Publicar prueba HTML como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Tierra-Magica-Manual-Basico-Prueba-HTML
          path: docs/edicion_impresa/Manual_Basico_Prueba_Integral.html
          if-no-files-found: error
      - name: Declarar fallo de reproducibilidad tras subir el artefacto
        if: steps.verify.outcome == 'failure'
        run: |
          echo 'El manuscrito versionado difiere de la salida del generador. Revisar el log de verificación.'
          exit 1
