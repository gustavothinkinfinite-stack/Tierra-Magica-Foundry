name: Consolidate familiar authority
on:
  push:
    paths:
      - '.github/workflows/consolidate-familiar-authority.yml'
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Remove historical familiar implementations
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('scripts/documents/actor.mjs')
          s = p.read_text()
          methods = [
              'linkedFamiliarAction',
              'commandFamiliar',
              'useFamiliarSense',
              'castFromFamiliar',
              'adjustResource',
          ]
          for index, name in enumerate(methods):
              next_names = methods[index + 1:] + ['callFamiliar', 'rest']
              alternatives = '|'.join(map(re.escape, next_names))
              pattern = rf'\n  async {re.escape(name)}\([^\n]*?\) \{{.*?(?=\n  async (?:{alternatives})\()'
              s, n = re.subn(pattern, '', s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'No se pudo retirar la implementación histórica: {name}')

          # callFamiliar sigue siendo una operación simple no reemplazada por familiar-guards.
          for name in methods:
              if re.search(rf'\n  async {re.escape(name)}\(', s):
                  raise SystemExit(f'Persistió método duplicado: {name}')
          if '\n  async callFamiliar(' not in s:
              raise SystemExit('La limpieza eliminó callFamiliar accidentalmente')
          p.write_text(s)
          PY
          npm install --ignore-scripts
          npm run validate
          rm .github/workflows/consolidate-familiar-authority.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/documents/actor.mjs .github/workflows/consolidate-familiar-authority.yml
          git commit -m 'refactor: make familiar guards the single authority'
          git push origin HEAD:main
