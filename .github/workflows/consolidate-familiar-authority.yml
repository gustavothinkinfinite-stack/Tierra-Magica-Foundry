name: Consolidate familiar authority
on:
  push:
    paths:
      - '.github/workflows/consolidate-familiar-authority.yml'
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Remove historical familiar implementations
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('scripts/documents/actor.mjs')
          s = p.read_text()
          methods = [
              'linkedFamiliarAction',
              'commandFamiliar',
              'useFamiliarSense',
              'castFromFamiliar',
              'adjustResource',
          ]

          def remove_async_method(source, name):
              match = re.search(rf'\n  async {re.escape(name)}\s*\(', source)
              if not match:
                  raise SystemExit(f'No se encontró la implementación histórica: {name}')
              start = match.start()
              brace = source.find('{', match.end())
              if brace < 0:
                  raise SystemExit(f'No se encontró apertura de método: {name}')
              depth = 0
              quote = None
              escaped = False
              i = brace
              while i < len(source):
                  ch = source[i]
                  if quote:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == quote:
                          quote = None
                  else:
                      if ch in ('"', "'", '`'):
                          quote = ch
                      elif ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              while end < len(source) and source[end] in ' \t':
                                  end += 1
                              if end < len(source) and source[end] == '\n':
                                  end += 1
                              return source[:start] + '\n' + source[end:]
                  i += 1
              raise SystemExit(f'No se encontró cierre de método: {name}')

          for name in methods:
              s = remove_async_method(s, name)

          for name in methods:
              if re.search(rf'\n  async {re.escape(name)}\s*\(', s):
                  raise SystemExit(f'Persistió método duplicado: {name}')
          if not re.search(r'\n  async callFamiliar\s*\(', s):
              raise SystemExit('La limpieza eliminó callFamiliar accidentalmente')
          if not re.search(r'\n  async rest\s*\(', s):
              raise SystemExit('La limpieza dañó el límite posterior del bloque')
          p.write_text(s)
          PY
          npm install --ignore-scripts
          npm run validate
          rm .github/workflows/consolidate-familiar-authority.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/documents/actor.mjs .github/workflows/consolidate-familiar-authority.yml
          git commit -m 'refactor: make familiar guards the single authority'
          git push origin HEAD:main
