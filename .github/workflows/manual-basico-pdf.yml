name: Maquetar Manual Básico (PDF de lectura)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/Tierra_Magica_Manual_Maestro.md'
      - 'tools/editorial/maquetar_manual.py'
      - 'tools/editorial/maquetacion.css'
      - 'tools/editorial/auditar_extraccion_pdf.py'
      - 'tools/editorial/auditar_preflight_pdf.py'
      - 'tools/editorial/inventariar_activos.py'
      - 'assets/editorial/**'
      - '.github/workflows/manual-basico-pdf.yml'

permissions:
  contents: read

concurrency:
  group: manual-basico-pdf
  cancel-in-progress: true

jobs:
  maqueta:
    name: Generar libro completo 6x9
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Obtener fuente canónica
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Tipografías y renderizador
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-lato fonts-dejavu-core poppler-utils
          python -m pip install --upgrade pip
          python -m pip install "weasyprint>=62,<70" "markdown-it-py>=4,<5" "beautifulsoup4>=4.12,<5" "pypdf>=5,<7"

      - name: Inventario de cubiertas y retratos autorizados
        run: |
          python tools/editorial/inventariar_activos.py \
            --assets assets/editorial \
            --output dist/control/activos_editoriales.json

      - name: Componer el manual completo
        run: |
          python tools/editorial/maquetar_manual.py \
            --source docs/Tierra_Magica_Manual_Maestro.md \
            --style tools/editorial/maquetacion.css \
            --assets assets/editorial \
            --output dist/Tierra_Magica_Manual_Basico_Lectura.pdf \
            --manifest dist/Tierra_Magica_Manual_Basico_Lectura.manifest.json
          pdfinfo dist/Tierra_Magica_Manual_Basico_Lectura.pdf | grep -E 'Pages:|Page size:|File size:'

      - name: Control de integridad y muestras de render
        run: |
          mkdir -p dist/control
          pdftoppm -f 1 -l 1 -scale-to 1100 -png -singlefile \
            dist/Tierra_Magica_Manual_Basico_Lectura.pdf dist/control/portada
          pdftoppm -f 5 -l 5 -scale-to 1100 -png -singlefile \
            dist/Tierra_Magica_Manual_Basico_Lectura.pdf dist/control/interior
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from pypdf import PdfReader
          pdf = Path('dist/Tierra_Magica_Manual_Basico_Lectura.pdf')
          m = json.loads(Path('dist/Tierra_Magica_Manual_Basico_Lectura.manifest.json').read_text())
          r = PdfReader(str(pdf))
          assert hashlib.sha256(pdf.read_bytes()).hexdigest() == m['pdf_sha256'], 'SHA-256 PDF no coincide con manifest'
          assert pdf.stat().st_size == m['pdf_bytes'], 'Tamaño PDF no coincide con manifest'
          assert hashlib.sha256(Path('docs/Tierra_Magica_Manual_Maestro.md').read_bytes()).hexdigest() == m['source_sha256'], 'SHA-256 fuente no coincide con manifest'
          inventory = json.loads(Path('dist/control/activos_editoriales.json').read_text(encoding='utf-8'))
          entries = inventory['entries']
          assert inventory['expected'] == 14 and len(entries) == 14, 'Inventario editorial incompleto'
          assert inventory['present'] == sum(e['status'] == 'present' for e in entries), 'Conteo del inventario inconsistente'
          assert bool(m['original_covers']['front_cover_original']) == (entries[0]['status'] == 'present'), 'Portada no coincide con inventario'
          assert bool(m['original_covers']['back_cover_original']) == (entries[1]['status'] == 'present'), 'Contraportada no coincide con inventario'
          assert all(e['status'] in ('present', 'missing') for e in entries), 'Hay archivos PNG inválidos: revisar activos editoriales'
          available_portraits = sum(e['status'] == 'present' for e in entries[2:])
          assert m['deity_illustrations'] == available_portraits, 'Retratos disponibles omitidos o duplicados en el PDF'
          if inventory['present'] == 14:
              assert m['deity_illustrations'] == 12, 'Hay 12 retratos disponibles pero no se insertaron todos en el PDF'
              assert all(m['original_covers'].values()), 'Cubiertas originales disponibles pero no incluidas'
          assert len(r.pages) == m['pages']
          assert len(r.pages) > 150
          assert m['toc_entries'] >= 55
          assert Path('dist/control/portada.png').stat().st_size > 10000
          assert Path('dist/control/interior.png').stat().st_size > 10000
          print('Integridad básica y render: OK',m['pages'],'páginas')
          PY

      - name: Muestras distribuidas de revisión visual
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          from pypdf import PdfReader
          pdf = Path('dist/Tierra_Magica_Manual_Basico_Lectura.pdf')
          out = Path('dist/control')
          total = len(PdfReader(str(pdf)).pages)
          pages = sorted(set([1, 3, 5, max(1, total // 6), max(1, total // 2), max(1, total * 5 // 6), total]))
          for page in pages:
              target = out / f'muestra_p{page:04d}'
              subprocess.run(['pdftoppm', '-f', str(page), '-l', str(page), '-scale-to', '1100', '-png', '-singlefile', str(pdf), str(target)], check=True)
              assert target.with_suffix('.png').stat().st_size > 10000, f'Muestra vacía: {page}'
          (out / 'muestras_visuales.json').write_text(json.dumps({'total_pages': total, 'sample_pages': pages, 'review_status': 'pending_human_visual_review'}, indent=2), encoding='utf-8')
          print('Muestras de revisión visual generadas:', pages)
          PY

      - name: Auditoría de enlaces internos del índice
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pypdf import PdfReader
          pdf = PdfReader('dist/Tierra_Magica_Manual_Basico_Lectura.pdf')
          report = {'pages': len(pdf.pages), 'internal_links': 0, 'external_links': 0, 'unresolved_destinations': 0, 'invalid_page_targets': 0}
          samples = []
          for page_no, page in enumerate(pdf.pages, 1):
              for annotation_ref in page.get('/Annots', []):
                  annotation = annotation_ref.get_object()
                  if annotation.get('/Subtype') != '/Link':
                      continue
                  action = annotation.get('/A')
                  dest = annotation.get('/Dest')
                  if action and action.get('/S') == '/URI':
                      report['external_links'] += 1
                      continue
                  if action and action.get('/S') == '/GoTo':
                      dest = action.get('/D')
                  if dest is None:
                      report['unresolved_destinations'] += 1
                      continue
                  report['internal_links'] += 1
                  try:
                      target = pdf.get_destination_page_number(dest)
                      if not 0 <= target < len(pdf.pages):
                          report['invalid_page_targets'] += 1
                          samples.append({'source_page': page_no, 'target': target})
                  except Exception as exc:
                      report['unresolved_destinations'] += 1
                      if len(samples) < 20:
                          samples.append({'source_page': page_no, 'error': str(exc)[:160]})
          report['examples'] = samples[:20]
          report['review_status'] = 'automated_link_audit_only'
          out = Path('dist/control/indice_enlaces.json')
          out.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          assert report['invalid_page_targets'] == 0, 'Índice: enlaces con destino fuera del PDF; revisar dist/control/indice_enlaces.json'
          assert report['unresolved_destinations'] == 0, 'Índice: enlaces sin destino resoluble; revisar dist/control/indice_enlaces.json'
          print('Auditoría de enlaces:', report)
          PY

      - name: Diagnóstico de extracción de texto
        if: success() || failure()
        run: |
          python tools/editorial/auditar_extraccion_pdf.py \
            dist/Tierra_Magica_Manual_Basico_Lectura.pdf \
            --output dist/control/extraccion_texto.json

      - name: Preflight técnico preliminar de páginas y fuentes
        if: success() || failure()
        run: |
          python tools/editorial/auditar_preflight_pdf.py \
            dist/Tierra_Magica_Manual_Basico_Lectura.pdf \
            --output dist/control/preflight_pdf.json

      - name: Registrar procedencia de la ejecución
        if: always()
        env:
          TM_REPO: ${{ github.repository }}
          TM_SHA: ${{ github.sha }}
          TM_RUN_ID: ${{ github.run_id }}
          TM_RUN_ATTEMPT: ${{ github.run_attempt }}
          TM_WORKFLOW: ${{ github.workflow }}
        run: |
          mkdir -p dist/control
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          data = {
              'repository': os.environ['TM_REPO'],
              'checkout_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'event_sha': os.environ['TM_SHA'],
              'run_id': os.environ['TM_RUN_ID'],
              'run_attempt': os.environ['TM_RUN_ATTEMPT'],
              'workflow': os.environ['TM_WORKFLOW'],
          }
          assert data['checkout_sha'] == data['event_sha'], 'Checkout no coincide con SHA de evento'
          data['run_url'] = 'https://github.com/' + data['repository'] + '/actions/runs/' + data['run_id']
          Path('dist/control/procedencia_ci.json').write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Inventario criptográfico de entrega
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path('dist')
          output = root / 'control' / 'entrega_sha256.json'
          files = {}
          for path in sorted(root.rglob('*')):
              if path.is_file() and path != output:
                  files[path.relative_to(root).as_posix()] = {
                      'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                      'bytes': path.stat().st_size,
                  }
          assert 'Tierra_Magica_Manual_Basico_Lectura.pdf' in files
          assert 'Tierra_Magica_Manual_Basico_Lectura.manifest.json' in files
          assert 'control/procedencia_ci.json' in files
          output.write_text(json.dumps({'schema': 1, 'files': files}, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('Archivos inventariados:', len(files))
          PY

      - name: Verificar inventario criptográfico antes de publicar
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path('dist')
          inventory = root / 'control' / 'entrega_sha256.json'
          data = json.loads(inventory.read_text(encoding='utf-8'))
          assert data['schema'] == 1 and data['files'], 'Inventario vacío o esquema incorrecto'
          actual = {p.relative_to(root).as_posix() for p in root.rglob('*')
                    if p.is_file() and p != inventory}
          expected = set(data['files'])
          assert actual == expected, f'Archivos no inventariados o faltantes: {sorted(actual ^ expected)}'
          for name, entry in data['files'].items():
              file = root / name
              assert file.stat().st_size == entry['bytes'], f'Tamaño incorrecto: {name}'
              assert hashlib.sha256(file.read_bytes()).hexdigest() == entry['sha256'], f'SHA-256 incorrecto: {name}'
          print('Inventario verificado:', len(expected), 'archivos')
          PY

      - name: Conservar diagnóstico si falla la validación
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tierra-magica-manual-basico-diagnostico-fallo
          path: |
            dist/Tierra_Magica_Manual_Basico_Lectura.manifest.json
            dist/control/*.json
            dist/control/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Conservar PDF y evidencia
        uses: actions/upload-artifact@v4
        with:
          name: tierra-magica-manual-basico-lectura
          path: |
            dist/Tierra_Magica_Manual_Basico_Lectura.pdf
            dist/Tierra_Magica_Manual_Basico_Lectura.manifest.json
            dist/control/*.png
            dist/control/*.json
          if-no-files-found: error
          retention-days: 30
