name: Maquetar Manual Básico (PDF de lectura)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/Tierra_Magica_Manual_Maestro.md'
      - 'tools/editorial/maquetar_manual.py'
      - 'tools/editorial/maquetacion.css'
      - 'tools/editorial/auditar_extraccion_pdf.py'
      - 'tools/editorial/inventariar_activos.py'
      - 'assets/editorial/**'
      - '.github/workflows/manual-basico-pdf.yml'

permissions:
  contents: read

concurrency:
  group: manual-basico-pdf
  cancel-in-progress: true

jobs:
  maqueta:
    name: Generar libro completo 6x9
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Obtener fuente canónica
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Tipografías y renderizador
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-lato fonts-dejavu-core poppler-utils
          python -m pip install --upgrade pip
          python -m pip install "weasyprint>=62,<70" "markdown-it-py>=4,<5" "beautifulsoup4>=4.12,<5" "pypdf>=5,<7"

      - name: Inventario de cubiertas y retratos autorizados
        run: |
          python tools/editorial/inventariar_activos.py \
            --assets assets/editorial \
            --output dist/control/activos_editoriales.json

      - name: Componer el manual completo
        run: |
          python tools/editorial/maquetar_manual.py \
            --source docs/Tierra_Magica_Manual_Maestro.md \
            --style tools/editorial/maquetacion.css \
            --assets assets/editorial \
            --output dist/Tierra_Magica_Manual_Basico_Lectura.pdf \
            --manifest dist/Tierra_Magica_Manual_Basico_Lectura.manifest.json
          pdfinfo dist/Tierra_Magica_Manual_Basico_Lectura.pdf | grep -E 'Pages:|Page size:|File size:'

      - name: Control de integridad y muestras de render
        run: |
          mkdir -p dist/control
          pdftoppm -f 1 -l 1 -scale-to 1100 -png -singlefile \
            dist/Tierra_Magica_Manual_Basico_Lectura.pdf dist/control/portada
          pdftoppm -f 5 -l 5 -scale-to 1100 -png -singlefile \
            dist/Tierra_Magica_Manual_Basico_Lectura.pdf dist/control/interior
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from pypdf import PdfReader
          pdf = Path('dist/Tierra_Magica_Manual_Basico_Lectura.pdf')
          m = json.loads(Path('dist/Tierra_Magica_Manual_Basico_Lectura.manifest.json').read_text())
          r = PdfReader(str(pdf))
          assert hashlib.sha256(pdf.read_bytes()).hexdigest() == m['pdf_sha256'], 'SHA-256 PDF no coincide con manifest'
          assert pdf.stat().st_size == m['pdf_bytes'], 'Tamaño PDF no coincide con manifest'
          assert hashlib.sha256(Path('docs/Tierra_Magica_Manual_Maestro.md').read_bytes()).hexdigest() == m['source_sha256'], 'SHA-256 fuente no coincide con manifest'
          inventory = json.loads(Path('dist/control/activos_editoriales.json').read_text(encoding='utf-8'))
          entries = inventory['entries']
          assert inventory['expected'] == 14 and len(entries) == 14, 'Inventario editorial incompleto'
          assert inventory['present'] == sum(e['status'] == 'present' for e in entries), 'Conteo del inventario inconsistente'
          assert bool(m['original_covers']['front_cover_original']) == (entries[0]['status'] == 'present'), 'Portada no coincide con inventario'
          assert bool(m['original_covers']['back_cover_original']) == (entries[1]['status'] == 'present'), 'Contraportada no coincide con inventario'
          assert 0 <= m['deity_illustrations'] <= sum(e['status'] == 'present' for e in entries[2:]), 'Retratos fuera del inventario'
          if inventory['present'] == 14:
              assert m['deity_illustrations'] == 12, 'Hay 12 retratos disponibles pero no se insertaron todos en el PDF'
              assert all(m['original_covers'].values()), 'Cubiertas originales disponibles pero no incluidas'
          assert len(r.pages) == m['pages']
          assert len(r.pages) > 150
          assert m['toc_entries'] >= 55
          assert Path('dist/control/portada.png').stat().st_size > 10000
          assert Path('dist/control/interior.png').stat().st_size > 10000
          print('Integridad básica y render: OK',m['pages'],'páginas')
          PY

      - name: Muestras distribuidas de revisión visual
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          from pypdf import PdfReader
          pdf = Path('dist/Tierra_Magica_Manual_Basico_Lectura.pdf')
          out = Path('dist/control')
          total = len(PdfReader(str(pdf)).pages)
          pages = sorted(set([1, 3, 5, max(1, total // 6), max(1, total // 2), max(1, total * 5 // 6), total]))
          for page in pages:
              target = out / f'muestra_p{page:04d}'
              subprocess.run(['pdftoppm', '-f', str(page), '-l', str(page), '-scale-to', '1100', '-png', '-singlefile', str(pdf), str(target)], check=True)
              assert target.with_suffix('.png').stat().st_size > 10000, f'Muestra vacía: {page}'
          (out / 'muestras_visuales.json').write_text(json.dumps({'total_pages': total, 'sample_pages': pages, 'review_status': 'pending_human_visual_review'}, indent=2), encoding='utf-8')
          print('Muestras de revisión visual generadas:', pages)
          PY

      - name: Diagnóstico de extracción de texto
        run: |
          python tools/editorial/auditar_extraccion_pdf.py \
            dist/Tierra_Magica_Manual_Basico_Lectura.pdf \
            --output dist/control/extraccion_texto.json

      - name: Conservar PDF y evidencia
        uses: actions/upload-artifact@v4
        with:
          name: tierra-magica-manual-basico-lectura
          path: |
            dist/Tierra_Magica_Manual_Basico_Lectura.pdf
            dist/Tierra_Magica_Manual_Basico_Lectura.manifest.json
            dist/control/*.png
            dist/control/*.json
          if-no-files-found: error
          retention-days: 30
