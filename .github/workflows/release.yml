name: Publicar sistema

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar sistema
        run: npm run validate

      - name: Determinar versión
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "TM_RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            VERSION=$(node -p "JSON.parse(require('fs').readFileSync('system.json','utf8')).version")
            echo "TM_RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"
          fi

      - name: Preparar paquete
        run: |
          mkdir -p package/tierra-magica
          rsync -a --exclude='.git' --exclude='.github' --exclude='package' --exclude='test' --exclude='node_modules' --exclude='*.zip' ./ package/tierra-magica/
          cd package
          zip -r ../tierra-magica.zip tierra-magica

      - name: Crear publicación
        uses: softprops/action-gh-release@v3
        with:
          files: tierra-magica.zip
          generate_release_notes: true
          tag_name: ${{ env.TM_RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
