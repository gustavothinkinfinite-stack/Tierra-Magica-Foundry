name: Ensamblar mapa maestro binario (temporal)
on:
  push:
    branches: [main]
    paths:
      - 'docs/cartografia/.transfer/**'
permissions:
  contents: write
jobs:
  ensamblar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reconstruir PNG original y verificar integridad
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,struct
          folder=Path('docs/cartografia/.transfer')
          parts=sorted(folder.glob('chunk_*.b64'))
          assert len(parts)==17, f'Faltan fragmentos: {len(parts)}'
          data=base64.b64decode(b''.join(p.read_bytes() for p in parts), validate=True)
          expected='e1d27cae1979c44c8cd6d11ac77e37056f522658d8967816f543ed867d57a34a'
          assert hashlib.sha256(data).hexdigest()==expected, 'La imagen no es idéntica al original'
          assert len(data)==3641728, 'Tamaño inesperado'
          assert data[:8]==b'\x89PNG\r\n\x1a\n', 'No es PNG'
          assert struct.unpack('>II',data[16:24])==(1448,1086), 'Resolución inesperada'
          Path('docs/cartografia/Tierra_Magica_Mapa_Maestro.png').write_bytes(data)
          print('PNG reconstruido, SHA256 verificado:',expected)
          PY
      - name: Confirmar el único mapa maestro PNG
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cartografia/Tierra_Magica_Mapa_Maestro.png
          git commit -m "Atlas: publicar PNG original como único Mapa Maestro" 
          git push origin HEAD:main
