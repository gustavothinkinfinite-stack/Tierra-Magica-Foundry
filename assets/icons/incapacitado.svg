<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 100 100"
  role="img" aria-label="X roja: token fuera de combate por 0 Vida">
  <title>X roja — Incapacitado a 0 Vida</title>
  <!-- Fondo transparente: la ilustración del token permanece visible. -->
  <!-- Contorno oscuro para distinguir la X sobre retratos claros y oscuros. -->
  <path d="M 10 10 L 90 90 M 90 10 L 10 90"
    fill="none" stroke="#1a1013" stroke-width="27"
    stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Las dos diagonales recorren el token de esquina a esquina. -->
  <path d="M 10 10 L 90 90 M 90 10 L 10 90"
    fill="none" stroke="#df2431" stroke-width="19"
    stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 13 13 L 87 87 M 87 13 L 13 87"
    fill="none" stroke="#ff6565" stroke-opacity="0.55"
    stroke-width="3" stroke-linecap="round"/>
</svg>
